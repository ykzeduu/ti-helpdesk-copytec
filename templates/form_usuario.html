{% extends "base.html" %}
{% block content %}
    <h2>Novo Usuário</h2>

    <div class="dados-auto">
        <p><strong>ID funcional (automático):</strong> {{ proximo_id }}</p>
        <p><strong>Senha padrão:</strong> 1234 — o usuário será obrigado a trocá-la no primeiro login.</p>
    </div>

    <form method="POST">
        <label>Nome</label>
        <input type="text" name="nome" required>

        <label>Computador</label>
        <input type="text" name="computador" placeholder="Ex: PC-FINANCEIRO-03">

        <label>Setor</label>
        <input type="text" name="setor" required>

        <label>Telefone</label>
        <input type="text" name="telefone">

        <label>Login de rede</label>
        <input type="text" name="login_rede" required>

        <label class="checkbox-linha">
            <input type="checkbox" name="is_admin"> Este usuário é administrador
        </label>

        <button type="submit">Cadastrar</button>
    </form>
{% endblock %}
