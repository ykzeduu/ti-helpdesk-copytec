<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Help Desk TI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-box">
        <h1>Help Desk TI</h1>
        <p class="subtitulo">Acesse com seu login de rede</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for msg in messages %}<p>{{ msg }}</p>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Login de rede</label>
            <input type="text" name="login_rede" required autofocus>

            <label>Senha</label>
            <input type="password" name="senha" required>

            <button type="submit">Entrar</button>
        </form>

        <p class="dica">Admin padrão: login <strong>admin</strong> / senha <strong>admin123</strong></p>
    </div>
</body>
</html>
