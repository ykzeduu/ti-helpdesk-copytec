<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - Help Desk TI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
    <div class="login-box">
        <h1>Help Desk TI</h1>
        <p class="subtitulo">Acesse com seu login de rede</p>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="flash">
                    {% for msg in messages %}<p>{{ msg }}</p>{% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <form method="POST">
            <label>Login de rede</label>
            <input type="text" name="login_rede" required autofocus>

            <label>Senha</label>
            <div class="campo-senha">
                <input type="password" name="senha" id="senha" required>
                <button type="button" class="botao-olho" onclick="alternarSenha()" aria-label="Mostrar senha">
                    <i class="ti ti-eye" id="icone-olho"></i>
                </button>
            </div>

            <button type="submit">Entrar</button>
        </form>
    </div>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
    <script>
        function alternarSenha() {
            const campo = document.getElementById('senha');
            const icone = document.getElementById('icone-olho');
            if (campo.type === 'password') {
                campo.type = 'text';
                icone.className = 'ti ti-eye-off';
            } else {
                campo.type = 'password';
                icone.className = 'ti ti-eye';
            }
        }
    </script>
</body>
</html>
